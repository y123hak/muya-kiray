<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ሙያ ኪራይ — መሣሪያ ይከራዩ</title>
<meta name="description" content="ለኮንትራክተሮች የሥራ መሣሪያ ኪራይ በአዲስ አበባ። ቀለም መርጫ፣ የጂፕሰም መሣሪያ፣ የሴራሚክ መቁረጫ እና ሌሎችም በቀን ኪራይ።">
<meta property="og:title" content="ሙያ ኪራይ — የሥራ መሣሪያ በቀን ይከራዩ።">
<meta property="og:description" content="ቀለም መርጫ፣ የጂፕሰም መሣሪያ፣ የሴራሚክ መቁረጫ እና ሌሎችም በቀን ኪራይ። አዲስ አበባ።">
<meta property="og:type" content="website">
<meta property="og:image" content="images/airless-paint-sprayer.webp">
<style>
:root{--bg:#F5F6F3;--ink:#15343B;--tape:#F3C316;--red:#C7352B;--card:#fff;--muted:#4d6268}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Ethiopic","Kefa","Nyala","Ebrima",system-ui,sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none;border:2px solid var(--ink)}
.btn-main{background:var(--tape);border-color:var(--tape);color:var(--ink)}
nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{font-weight:800;font-size:1.3rem}
.logo span{background:var(--tape);padding:0 6px;border-radius:4px}
.hero{padding:8px 0 4px}
.hero h1{font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.3;margin-bottom:4px}
.hero p{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
section{padding:36px 0}
h2{font-size:1.5rem;margin-bottom:18px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(21,52,59,.12);overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#eceee8 0 12px,#e3e6df 12px 24px);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);text-align:center;padding:10px}
.pic{position:relative}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:1.1rem}
.price{font-weight:800;margin:6px 0 10px}
.two{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{text-align:center;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;padding:7px 8px}
#cart{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;display:none;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px}
body{padding-bottom:80px}
.band{background:var(--ink);color:var(--bg);border-radius:14px;padding:28px 20px;text-align:center}
.band h2{margin-bottom:10px}
.band p{margin-bottom:16px}
footer{padding:28px 0;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<nav>
 <div class="logo"><span>ሙያ</span> ኪራይ</div>
</nav>

<header class="hero">
 <h1>የሥራ መሣሪያ በቀን ይከራዩ።</h1>
 <p>ለጂፕሰም፣ ለቀለም፣ ለሴራሚክ፣ ለኤሌክትሪክና ለፋይበር ሥራ። አዲስ አበባ።</p>
</header>

<section id="tools" style="padding-top:16px">
 <div class="cards" id="cards"></div>
</section>

<section>
 <div class="band">
  <h2>የሚፈልጉት መሣሪያ የለም?</h2>
  <p>ይንገሩን፤ እናመጣለን።</p>
  <a class="btn btn-main" href="https://t.me/muyakiray">በቴሌግራም ይጻፉልን</a>
 </div>
</section>

<footer>
 ሙያ ኪራይ · አዲስ አበባ · ቴሌግራም: <a href="https://t.me/muyakiray">@muyakiray</a> · ስልክ: [YOUR NUMBER]<br>ፎቶዎች: Wikimedia Commons
</footer>
</div>

<div id="cart"><span id="count"></span><a class="btn btn-main" id="send">በቴሌግራም ይላኩ</a></div>

<script>
const TG = "muyakiray";
const tools = [
 ["airless-paint-sprayer","ቀለም","የቀለም መርጫ ማሽን","ከብሩሽ በብዙ እጥፍ ፈጣን፣ እኩል ቀለም።","1,500","Airless paint sprayer"],
 ["gypsum-board-lift","ጂፕሰም","የጂፕሰም ቦርድ ማንሻ","አንድ ሰው ብቻውን ጣሪያ ይገጥማል።","1,200","Gypsum board lift"],
 ["gas-nailer","ጂፕሰም","የጋዝ ሚስማር መቺ","ያለ ቁፋሮ በኮንክሪት ላይ ይመታል።","1,500","Gas nailer"],
 ["wall-chaser","ኤሌክትሪክ","የግድግዳ ቦይ መቁረጫ","ቀጥ ያለ፣ ንጹሕ ቦይ፤ ያለ አቧራ።","1,000","Wall chaser"],
 ["diamond-core-drill","ቧንቧ","ክብ ቀዳዳ መብሻ","ለቧንቧና ለኤሲ ንጹሕ ክብ ቀዳዳ።","2,000","Diamond core drill"],
 ["tile-cutter-1200mm","ሴራሚክ","የሴራሚክ መቁረጫ (1200 ሚ.ሜ)","ፖርሴሊንን ሳይሰበር ቀጥ ይቆርጣል።","1,000","1200mm tile cutter"],
 ["floor-grinder-polisher","ወለል","የወለል መፋቂያና ማንጸባረቂያ","ቴራዞና ኮንክሪትን ያንጸባርቃል።","2,500","Floor grinder/polisher"],
 ["fiber-fusion-splicer","ፋይበር","የፋይበር ማገጣጠሚያ","ፋይበርን በሰከንዶች ያገጣጥማል።","3,500","Fiber fusion splicer"]
];
document.getElementById("cards").innerHTML = tools.map(([img,cat,name,line,price,en]) => `
 <div class="card">
  <div class="pic">${name}<img src="images/${img}.webp" alt="${name}" loading="lazy" onerror="this.remove()"></div>
  <div class="body">
   <h3>${name}</h3>
   <p>${line}</p>
   <div class="price">በቀን ${price} ብር</div>
   <div class="two">
    <a class="btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(en + " how to use")}" target="_blank">እንዴት እንደሚሠራ ይዩ</a>
    <button class="btn btn-main" onclick="add(this,'${name}','${en}')">ምረጥ</button>
   </div>
  </div>
 </div>`).join("");
const cart = [];
function add(btn, name, en) {
 if (cart.some(c => c[0] === name)) return;
 cart.push([name, en]);
 btn.textContent = "✓ ተመርጧል";
 document.getElementById("cart").style.display = "flex";
 document.getElementById("count").textContent = cart.length + " መሣሪያ ተመርጧል";
 document.getElementById("send").href = `https://t.me/${TG}?text=${encodeURIComponent("ሰላም፣ እነዚህን መከራየት እፈልጋለሁ፦\n" + cart.map(c => "- " + c[0] + " (" + c[1] + ")").join("\n"))}`;
}
</script>
</body>
</html>
