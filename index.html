<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ሙያ ኪራይ — መሣሪያ ይከራዩ</title>
<meta name="description" content="ለኮንትራክተሮች የሥራ መሣሪያ ኪራይ በአዲስ አበባ። ቀለም መርጫ፣ የጂፕሰም መሣሪያ፣ የሴራሚክ መቁረጫ እና ሌሎችም በቀን ኪራይ።">
<meta property="og:title" content="ሙያ ኪራይ — የሥራ መሣሪያ በቀን ይከራዩ።">
<meta property="og:description" content="ቀለም መርጫ፣ የጂፕሰም መሣሪያ፣ የሴራሚክ መቁረጫ እና ሌሎችም በቀን ኪራይ። አዲስ አበባ።">
<meta property="og:type" content="website">
<meta property="og:image" content="images/airless-paint-sprayer.webp">
<style>
:root{--bg:#fafaf9;--fg:#15343B;--card:#fff;--muted:#64748b;--border:#e4e4e7;--primary:#15343B;--primary-fg:#fafafa;--accent:#F3C316;--radius:8px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Ethiopic","Kefa","Nyala","Ebrima",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:88px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .15s}
.btn:hover{background:#f4f4f5}
.btn-main{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn-main:hover{background:#1d4650}
nav{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--border);margin-bottom:24px}
.logo{font-weight:700;font-size:17px}
.logo span{background:var(--accent);padding:0 6px;border-radius:4px}
.hero{margin:8px 0 28px}
.hero h1{font-size:clamp(38px,11vw,64px);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
.hero p{color:var(--muted);font-size:clamp(17px,4.5vw,21px)}
section{margin-bottom:40px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:4/3;background:#f4f4f5;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);text-align:center;padding:12px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:8px;display:block}
.body{padding:16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:16px;font-weight:600}
.body p{font-size:14px;color:var(--muted)}
.price{font-size:15px;font-weight:600;margin:8px 0 16px}
.two{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{padding:0 8px;font-size:13px}
#cart{position:fixed;left:16px;right:16px;bottom:16px;max-width:480px;margin:0 auto;display:none;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);padding:10px 10px 10px 16px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.12);font-size:14px;font-weight:500}
.band{background:var(--primary);color:var(--primary-fg);border-radius:12px;padding:32px 20px;text-align:center}
.band h2{font-size:20px;font-weight:600;margin-bottom:6px}
.band p{opacity:.8;margin-bottom:20px}
.band .btn{background:var(--accent);border-color:var(--accent);color:var(--fg)}
footer{border-top:1px solid var(--border);padding:24px 0;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<nav>
 <div class="logo"><span>ሙያ</span> ኪራይ</div>
</nav>

<header class="hero">
 <h1>የሥራ መሣሪያ በቀን ይከራዩ።</h1>
 <p>ለጂፕሰም፣ ለቀለም፣ ለሴራሚክና ለኤሌክትሪክ ሥራ። አዲስ አበባ።</p>
</header>

<section id="tools">
 <div class="cards" id="cards"></div>
</section>

<section>
 <div class="band">
  <h2>የሚፈልጉት መሣሪያ የለም?</h2>
  <p>ይንገሩን፤ እናመጣለን።</p>
  <a class="btn btn-main" href="tel:0911000000">ይደውሉ፦ 0911000000</a>
 </div>
</section>

<footer>
 ሙያ ኪራይ · አዲስ አበባ · ቴሌግራም: <a href="https://t.me/muyakiray">@muyakiray</a> · ስልክ: <a href="tel:0911000000">0911000000</a><br>ፎቶዎች: Wikimedia Commons
</footer>
</div>

<div id="cart"><span id="count"></span><a class="btn btn-main" href="tel:0911000000">ይደውሉ</a></div>

<script>
const TG = "muyakiray";
const tools = [
 ["airless-paint-sprayer","ቀለም","የቀለም መርጫ ማሽን","ከብሩሽ በብዙ እጥፍ ፈጣን፣ እኩል ቀለም።","1,500","Airless paint sprayer"],
 ["gypsum-board-lift","ጂፕሰም","የጂፕሰም ቦርድ ማንሻ","ጂፕሰም ቦርድን ወደ ጣሪያ ያነሳል፤ አንድ ሰው ብቻውን ይገጥማል።","1,200","Gypsum board lift"],
 ["wall-chaser","ኤሌክትሪክ","የግድግዳ ቦይ መቁረጫ","ለኤሌክትሪክ ቱቦ ቀጥ ያለና ንጹሕ ቦይ ይቆርጣል።","1,000","Wall chaser"],
 ["tile-cutter-1200mm","ሴራሚክ","የሴራሚክ መቁረጫ ማሽን","ሴራሚክና ፖርሴሊንን ሳይሰበር ቀጥ አድርጎ ይቆርጣል።","1,000","Tile cutting machine"],
 ["floor-grinder-polisher","ወለል","የወለል መፋቂያና ማንጸባረቂያ","ቴራዞና ኮንክሪትን ያንጸባርቃል።","2,500","Floor grinder/polisher"],
 ["paddle-mixer","","የቀለምና የሲሚንቶ ማደባለቂያ","ቀለም፣ ፑቲና ሲሚንቶን በደቂቃዎች ያዋህዳል።","500","Paddle mixer"],
 ["jackhammer","","ጃክ ሀመር (ማፍረሻ)","ኮንክሪትና ግድግዳን በፍጥነት ያፈርሳል።","2,000","Jackhammer"],
 ["generator","","ጄኔሬተር","መብራት ቢጠፋም ሥራዎ አይቋረጥም።","1,500","Generator"],
 ["scaffold-tower","","ተንቀሳቃሽ ስካፎልድ","ለጣሪያና ለከፍታ ሥራ ደህንነቱ የተጠበቀ መቆሚያ።","800","Scaffold tower"],
 ["air-compressor","","የአየር ኮምፕሬሰር","ለቀለም መርጫና ለአየር መሣሪያዎች አየር ያቀርባል።","1,000","Air compressor"]
];
document.getElementById("cards").innerHTML = tools.map(([img,cat,name,line,price,en]) => `
 <div class="card">
  <div class="pic">${name}<img src="images/${img}.webp" alt="${name}" loading="lazy" onerror="this.remove()"></div>
  <div class="body">
   <h3>${name}</h3>
   <p>${line}</p>
   <div class="price">በቀን ${price} ብር</div>
   <div class="two">
    <a class="btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(en + " how to use")}" target="_blank">አጠቃቀሙን ይዩ</a>
    <button class="btn btn-main" onclick="add(this,'${name}','${en}')">ምረጥ</button>
   </div>
  </div>
 </div>`).join("");
const cart = [];
function add(btn, name, en) {
 if (cart.some(c => c[0] === name)) return;
 cart.push([name, en]);
 btn.textContent = "✓ ተመርጧል";
 document.getElementById("cart").style.display = "flex";
 document.getElementById("count").textContent = cart.length + " መሣሪያ ተመርጧል";
}
</script>
</body>
</html>
